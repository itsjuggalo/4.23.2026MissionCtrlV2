<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b10">
<title>Options Trading Academy</title>
<style>
:root{
  --bg:#070b10; --panel:#0e141c; --panel2:#131b25; --steel:#1a2530; --ink:#e9eef4; --mut:#8593a1;
  --line:#27323f; --line2:#324252;
  --amber:#ffb020; --amber2:#ffd479; --green:#3fb950; --red:#f85149; --blue:#58a6ff; --cyan:#36d6e7;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,"Courier New",monospace;
  --disp:Bahnschrift,"Segoe UI Semibold","Arial Narrow",Arial,sans-serif;
  --body:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:17px; line-height:1.55; -webkit-text-size-adjust:100%;
  background-image:
    radial-gradient(ellipse 90% 45% at 50% -8%, rgba(54,214,231,.07), transparent 70%),
    radial-gradient(ellipse 70% 40% at 50% 105%, rgba(255,176,32,.05), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(54,214,231,.018) 3px 4px);
  background-attachment:fixed;
}
.wrap{max-width:760px; margin:0 auto; padding:18px 14px 90px; position:relative; z-index:1}
button{font-family:inherit}
.mono{font-family:var(--mono)}

/* top progress bar */
#topbar{position:sticky; top:0; z-index:50; height:5px; background:rgba(7,11,16,.9);
  border-bottom:1px solid var(--line2)}
#topbar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--blue));
  box-shadow:0 0 10px rgba(54,214,231,.5); transition:width .25s}

/* HERO */
.hero{position:relative; border:1px solid var(--line2); border-radius:10px; overflow:hidden;
  background:linear-gradient(160deg,#0c1622,#0a121b 60%,#0b0f15); padding:16px 16px 18px; margin-top:10px;
  box-shadow:inset 0 0 40px rgba(54,214,231,.06)}
.hero::after{content:""; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--cyan),transparent 60%)}
.crumb{font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--cyan); margin:0 0 4px}
h1{font-family:var(--disp); font-size:clamp(28px,8vw,46px); line-height:.98; text-transform:uppercase;
  letter-spacing:.01em; margin:0}
h1 .n{color:var(--amber)}
.tagline{color:var(--mut); font-size:14px; margin:8px 0 0}
.tagline b{color:var(--amber2)}

/* readout chips */
.readout{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.stat{flex:1 1 90px; min-width:84px; border:1px solid var(--line); border-left:3px solid var(--cyan);
  background:rgba(54,214,231,.04); border-radius:0 5px 5px 0; padding:7px 10px}
.stat .v{font-family:var(--disp); font-size:22px; line-height:1; color:var(--ink)}
.stat .l{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--mut); margin-top:3px; text-transform:uppercase}
.stat.amb{border-left-color:var(--amber); background:rgba(255,176,32,.05)} .stat.amb .v{color:var(--amber2)}
.stat.grn{border-left-color:var(--green); background:rgba(63,185,80,.05)} .stat.grn .v{color:var(--green)}

/* section label */
.lbl{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--mut); text-transform:uppercase;
  margin:26px 0 10px; display:flex; align-items:center; gap:8px}
.lbl::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line2),transparent)}

/* mode buttons */
.modes{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.mode{display:flex; flex-direction:column; gap:3px; text-align:left; cursor:pointer; color:var(--ink);
  border:1px solid var(--line2); border-left:3px solid var(--blue); border-radius:7px; padding:11px 12px;
  background:linear-gradient(110deg,var(--panel2),var(--panel) 75%); transition:border-color .12s, box-shadow .12s}
.mode:hover,.mode:focus{border-left-color:var(--cyan); box-shadow:0 0 14px rgba(54,214,231,.12); outline:none}
.mode .t{font-family:var(--disp); font-size:16px; letter-spacing:.02em}
.mode .d{font-size:12px; color:var(--mut); line-height:1.35}
.mode.exam{border-left-color:var(--amber)} .mode.exam .t{color:var(--amber2)}

/* module cards */
.mods{display:grid; grid-template-columns:1fr; gap:9px; margin-top:4px}
@media(min-width:560px){ .mods{grid-template-columns:1fr 1fr} }
.modcard{display:block; text-align:left; cursor:pointer; color:var(--ink); width:100%;
  border:1px solid var(--line2); border-left:3px solid var(--cyan); border-radius:7px; padding:11px 12px;
  background:linear-gradient(110deg,var(--panel2),var(--panel) 70%); transition:border-color .12s, box-shadow .12s}
.modcard:hover,.modcard:focus{border-left-color:var(--amber); box-shadow:0 0 14px rgba(54,214,231,.1); outline:none}
.modcard .h{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.modcard .nm{font-family:var(--disp); font-size:16px; letter-spacing:.02em}
.modcard .pct{font-family:var(--mono); font-size:12px; color:var(--cyan)}
.modcard .bl{font-size:12px; color:var(--mut); line-height:1.35; margin:4px 0 8px}
.pbar{height:6px; border-radius:3px; background:var(--steel); overflow:hidden; border:1px solid var(--line)}
.pbar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--green),var(--cyan))}

/* QUESTION card */
.qcard{border:1px solid var(--line2); border-radius:10px; background:var(--panel); padding:15px 15px 16px; margin-top:12px}
.qmeta{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-bottom:11px}
.chip{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--bg);
  background:var(--cyan); padding:2px 8px; border-radius:3px}
.chip.lv{background:var(--blue)} .chip.lv.l2{background:var(--amber)} .chip.lv.l3{background:var(--red)}
.qcount{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--mut)}
.qtext{font-family:var(--disp); font-size:20px; line-height:1.3; margin:0 0 14px}
.svgwrap{margin:0 0 14px}
.opts{display:flex; flex-direction:column; gap:8px}
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%; cursor:pointer; color:var(--ink);
  border:1px solid var(--line2); border-radius:7px; padding:11px 12px; min-height:48px;
  background:var(--panel2); transition:border-color .12s, background .12s; font-size:15px; line-height:1.4}
.opt:hover:not(.locked){border-color:var(--cyan)}
.opt .k{font-family:var(--mono); font-size:13px; color:var(--mut); flex-shrink:0; width:16px}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--green); background:rgba(63,185,80,.12)} .opt.correct .k{color:var(--green)}
.opt.wrong{border-color:var(--red); background:rgba(248,81,73,.12)} .opt.wrong .k{color:var(--red)}
.opt.dim{opacity:.5}
.opt .mk{margin-left:auto; font-weight:bold; flex-shrink:0}
.opt.correct .mk{color:var(--green)} .opt.wrong .mk{color:var(--red)}

/* why + rh note */
.why{border:1px solid var(--blue); border-left:3px solid var(--blue); border-radius:8px; padding:11px 13px; margin-top:13px;
  background:linear-gradient(180deg,rgba(88,166,255,.08),rgba(88,166,255,.02))}
.why .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--blue); margin-bottom:5px}
.why p{margin:0; font-size:14px; line-height:1.5; color:var(--ink)}
.rhnote{border:1px solid var(--amber); border-left:3px solid var(--amber); border-radius:8px; padding:10px 13px; margin-top:9px;
  background:linear-gradient(180deg,rgba(255,176,32,.09),rgba(255,176,32,.02))}
.rhnote .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--amber); margin-bottom:4px}
.rhnote p{margin:0; font-size:13.5px; line-height:1.45; color:var(--amber2)}
.debate{border:1px solid var(--purple,#a371f7); border-left:3px solid var(--purple,#a371f7); border-radius:8px; padding:10px 13px; margin-top:9px;
  background:linear-gradient(180deg,rgba(163,113,247,.10),rgba(163,113,247,.02))}
.debate .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--purple,#a371f7); margin-bottom:6px}
.debate .lens{display:flex; gap:9px; padding:5px 0; border-top:1px solid rgba(163,113,247,.16); font-size:13px; line-height:1.4}
.debate .lens:first-of-type{border-top:none}
.debate .who{flex:0 0 92px; font-weight:700; color:var(--purple,#a371f7)}
.debate .stance{flex:1; color:var(--ink)}
@media(max-width:480px){ .debate .lens{flex-direction:column; gap:1px} .debate .who{flex:none} }

/* controls */
.controls{display:flex; gap:9px; margin-top:15px; flex-wrap:wrap}
.btn{flex:1 1 auto; min-height:48px; cursor:pointer; font-family:var(--disp); font-size:16px; letter-spacing:.03em;
  color:var(--bg); background:var(--cyan); border:none; border-radius:7px; padding:11px 16px;
  box-shadow:0 0 14px rgba(54,214,231,.25)}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--ink); background:transparent; border:1px solid var(--line2); box-shadow:none; flex:0 0 auto}
.btn.ghost:hover{border-color:var(--cyan)}
.btn.amb{background:var(--amber); color:#1a1206}

/* results */
.results{border:1px solid var(--line2); border-radius:10px; background:var(--panel); padding:20px 16px; margin-top:14px; text-align:center}
.grade{font-family:var(--disp); font-size:clamp(54px,18vw,90px); line-height:1; margin:6px 0}
.grade.a{color:var(--green)} .grade.b{color:var(--cyan)} .grade.c{color:var(--amber2)} .grade.d{color:var(--amber)} .grade.f{color:var(--red)}
.results .sc{font-family:var(--mono); font-size:15px; color:var(--mut)}
.results .sc b{color:var(--ink)}
.bench{border:1px solid var(--amber); border-radius:8px; padding:11px 13px; margin:15px 0 4px; text-align:left;
  background:linear-gradient(180deg,rgba(255,176,32,.08),rgba(255,176,32,.02))}
.bench .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--amber); margin-bottom:5px}
.bench p{margin:0; font-size:13.5px; line-height:1.5; color:var(--ink)}
.empty{border:1px dashed var(--line2); border-radius:8px; padding:18px; text-align:center; color:var(--mut); margin-top:14px; font-size:14px}
.foot{margin-top:30px; font-family:var(--mono); font-size:10.5px; color:var(--mut); text-align:center; letter-spacing:.06em; line-height:1.6}

/* ---- REFERENCE / TEXTBOOK ---- */
.ref-section{margin:28px 0 0}
.ref-h{font-family:var(--disp); font-size:clamp(18px,5vw,26px); letter-spacing:.03em; text-transform:uppercase; color:var(--cyan); margin:0 0 10px}
.ref-sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--mut); text-transform:uppercase; margin:0 0 6px}
.ref-card{border:1px solid var(--line2); border-left:3px solid var(--blue); border-radius:8px;
  background:linear-gradient(160deg,var(--panel2),var(--panel) 70%); padding:13px 14px; margin-bottom:10px}
.ref-card p{margin:0 0 8px; font-size:14px; line-height:1.55; color:var(--ink)}
.ref-card p:last-child{margin-bottom:0}
.ref-card .rt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--blue); margin-bottom:6px}
.ref-rule{border:1px solid var(--amber); border-left:3px solid var(--amber); border-radius:8px;
  background:linear-gradient(180deg,rgba(255,176,32,.08),rgba(255,176,32,.02)); padding:10px 13px; margin:10px 0}
.ref-rule .rt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--amber); margin-bottom:5px}
.ref-rule p{margin:0; font-size:13.5px; line-height:1.45; color:var(--amber2)}
/* theta decay SVG card */
.ref-svg-wrap{border:1px solid var(--line2); border-radius:8px; background:var(--panel2);
  padding:12px 10px 8px; margin:10px 0; overflow:hidden}
.ref-svg-wrap svg{display:block; width:100%; height:auto}
/* IV/HV bar */
.ivhv-wrap{border:1px solid var(--line2); border-radius:8px; background:var(--panel2); padding:14px; margin:10px 0}
.ivhv-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px}
.ivhv-row:last-child{margin-bottom:0}
.ivhv-label{flex:0 0 80px; font-family:var(--mono); font-size:11px; color:var(--mut); text-align:right}
.ivhv-bar{flex:1; height:22px; border-radius:4px; position:relative; background:var(--steel); overflow:visible}
.ivhv-fill{height:100%; border-radius:4px; display:flex; align-items:center; padding-left:6px;
  font-family:var(--mono); font-size:11px; font-weight:700}
.ivhv-tick{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--amber); border-radius:1px}
.ivhv-tick-label{position:absolute; top:-18px; font-family:var(--mono); font-size:10px; color:var(--amber); white-space:nowrap; transform:translateX(-50%)}
/* debate table (reference variant) */
.ref-debate{width:100%; border-collapse:collapse; font-size:13px; margin:8px 0}
.ref-debate th{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--mut);
  border-bottom:1px solid var(--line2); padding:5px 8px; text-align:left; white-space:nowrap}
.ref-debate td{padding:7px 8px; border-bottom:1px solid rgba(39,50,63,.6); vertical-align:top; line-height:1.4}
.ref-debate td:first-child{font-weight:700; color:var(--purple,#a371f7); white-space:nowrap}
.ref-debate td:nth-child(3){font-family:var(--mono); font-size:11px; color:var(--cyan)}
.ref-debate tr:last-child td{border-bottom:none}
@media(max-width:520px){
  .ref-debate thead{display:none}
  .ref-debate td{display:block; padding:3px 8px}
  .ref-debate td:first-child{padding-top:9px; font-size:14px}
  .ref-debate tr{display:block; border-bottom:1px solid var(--line2); margin-bottom:4px; padding-bottom:4px}
}
/* straddle calculator */
.calc-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:10px 0}
@media(max-width:420px){.calc-grid{grid-template-columns:1fr}}
.calc-field{display:flex; flex-direction:column; gap:4px}
.calc-field label{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--mut)}
.calc-field input{background:var(--steel); border:1px solid var(--line2); border-radius:5px; color:var(--ink);
  font-family:var(--mono); font-size:15px; padding:8px 10px; width:100%; -moz-appearance:textfield}
.calc-field input:focus{outline:none; border-color:var(--blue)}
.calc-field input::-webkit-outer-spin-button,.calc-field input::-webkit-inner-spin-button{-webkit-appearance:none}
.calc-out{border:1px solid var(--line2); border-radius:8px; background:var(--panel); padding:12px 14px; margin-top:8px}
.calc-row{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0;
  border-bottom:1px solid rgba(39,50,63,.5); font-size:13px; gap:8px; flex-wrap:wrap}
.calc-row:last-child{border-bottom:none}
.calc-row .ck{color:var(--mut); font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase}
.calc-row .cv{font-family:var(--disp); font-size:17px; color:var(--ink)}
.verdict-chip{display:inline-block; font-family:var(--mono); font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; padding:3px 9px; border-radius:4px; margin-left:6px; vertical-align:middle}
.verdict-chip.cheap{background:rgba(63,185,80,.2); color:var(--green); border:1px solid var(--green)}
.verdict-chip.rich{background:rgba(248,81,73,.2); color:var(--red); border:1px solid var(--red)}
.verdict-chip.fair{background:rgba(255,176,32,.15); color:var(--amber2); border:1px solid var(--amber)}
.mode.ref{border-left-color:var(--purple,#a371f7)} .mode.ref .t{color:#c9a8ff}
/* contract P/L grid (price x time heatmap) + multi-leg payoff */
.grid-wrap{overflow-x:auto; margin-top:10px; -webkit-overflow-scrolling:touch}
.plgrid{border-collapse:collapse; font-family:var(--mono); font-size:10px; margin:0 auto; min-width:100%}
.plgrid th,.plgrid td{border:1px solid rgba(7,11,16,.6); padding:4px 5px; text-align:center; white-space:nowrap}
.plgrid thead th{background:var(--panel2); color:var(--mut); font-size:9.5px; letter-spacing:.06em; position:sticky; top:0}
.plgrid .rowhdr{background:var(--panel2); color:var(--ink); font-weight:700; text-align:right; padding-right:7px}
.plgrid .rowhdr.spot{color:var(--cyan)} .plgrid .cell{color:#0a0e14; font-weight:600}
.plgrid .cell.be{outline:2px dashed var(--amber); outline-offset:-2px}
.plgrid .colcliff{box-shadow:inset 3px 0 0 var(--red), inset -3px 0 0 var(--red)}
.gridlegend{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:9px; font-family:var(--mono); font-size:10.5px; color:var(--mut)}
.gridlegend b{color:var(--ink)} .gridlegend .sw{display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:middle; margin-right:4px}
.subtabs{display:flex; gap:6px; margin:0 0 10px; flex-wrap:wrap}
.subtab{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--mut);
  background:var(--steel); border:1px solid var(--line2); border-radius:5px; padding:7px 11px; cursor:pointer; transition:.15s}
.subtab.on{color:var(--cyan); border-color:var(--cyan); background:rgba(54,214,231,.08)}
.pnl-pos{color:var(--green)} .pnl-neg{color:var(--red)}
.ml-select{background:var(--steel); border:1px solid var(--line2); border-radius:5px; color:var(--ink);
  font-family:var(--mono); font-size:13px; padding:9px 10px; width:100%}
.payoff-wrap{border:1px solid var(--line2); border-radius:8px; background:var(--panel2); padding:10px; margin-top:10px}
.payoff-wrap svg{display:block; width:100%; height:auto}
</style>
</head>
<body>
<div id="topbar"><i id="topbarfill"></i></div>
<div class="wrap" id="app"></div>

<script>const BANK = /*__BANK__*/;</script>
<script>
(function(){
  "use strict";
  var QS = BANK.questions, META = BANK.meta;
  var MODS = META.modules, MODBY = {}; MODS.forEach(function(m){ MODBY[m.id]=m; });
  var LETTERS = ["A","B","C","D"];
  var KEY = "oac_v1";

  // ---- state (localStorage) ----
  function loadState(){
    try{ var s = JSON.parse(localStorage.getItem(KEY)||"{}"); s.boxes=s.boxes||{}; s.stats=s.stats||{right:0,wrong:0}; return s; }
    catch(e){ return {boxes:{},stats:{right:0,wrong:0}}; }
  }
  function saveState(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
  var ST = loadState();

  // box: 1..5 (higher = better known). unseen = undefined.
  function box(id){ return ST.boxes[id]; }
  function recordAnswer(id, correct){
    var prev = ST.boxes[id]==null ? 2 : ST.boxes[id];
    ST.boxes[id] = correct ? Math.min(prev+1,5) : 1;
    if(correct) ST.stats.right++; else ST.stats.wrong++;
    saveState(ST);
  }
  function masteryPct(modId){
    var inMod = QS.filter(function(q){return q.module===modId;});
    if(!inMod.length) return 0;
    var mastered = inMod.filter(function(q){ return (ST.boxes[q.id]||0)>=3; }).length;
    return Math.round(mastered/inMod.length*100);
  }
  function overallMastery(){
    var mastered = QS.filter(function(q){ return (ST.boxes[q.id]||0)>=3; }).length;
    return Math.round(mastered/QS.length*100);
  }
  function reviewQueue(){
    // questions you've gotten wrong / are shaky on (box 1-2), weakest first
    return QS.filter(function(q){ var b=ST.boxes[q.id]; return b!=null && b<=2; })
             .sort(function(a,b){ return (ST.boxes[a.id]) - (ST.boxes[b.id]); });
  }

  // ---- util ----
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function setProgress(p){ document.getElementById('topbarfill').style.width = Math.max(0,Math.min(100,p))+"%"; }

  var app = document.getElementById('app');

  // ---- session ----
  var session = null; // {queue, idx, right, wrong, mode, modId, exam}

  function startSession(mode, modId){
    var queue;
    if(mode==='module') queue = QS.filter(function(q){return q.module===modId;});
    else if(mode==='mixed') queue = shuffle(QS);
    else if(mode==='review') queue = reviewQueue();
    else if(mode==='exam') queue = shuffle(QS).slice(0, Math.min(50, QS.length));
    if(!queue || !queue.length){ renderHome("noreview"); return; }
    session = {queue:queue, idx:0, right:0, wrong:0, answered:false, mode:mode, modId:modId, exam:(mode==='exam')};
    renderQuestion();
  }

  // ---- screens ----
  function renderHome(flag){
    session=null; setProgress(0);

  function renderQuestion(){
    var s=session, q=s.queue[s.idx];
    s.answered=false;
    setProgress(s.idx / s.queue.length * 100);
    var m = MODBY[q.module]||{name:q.module};
    var lvName = {1:"Beginner",2:"Intermediate",3:"Advanced"}[q.level]||("L"+q.level);
    var head =
      '<div class="qmeta">'+
        '<span class="chip">'+esc(m.name)+'</span>'+
        '<span class="chip lv l'+q.level+'">'+lvName+'</span>'+
        '<span class="qcount">'+(s.exam?'EXAM ':'')+(s.idx+1)+' / '+s.queue.length+'</span>'+
      '</div>';
    // shuffle option ORDER per question (kills the "answer is always B" pattern tell);
    // data-i keeps the ORIGINAL index so grading/correctness logic is unchanged — only the
    // displayed letter is re-mapped to the visual slot. Order is stable within a session.
    s.order = s.order || {};
    if(!s.order[q.id]){ var _a=[]; for(var _k=0;_k<q.options.length;_k++)_a.push(_k); s.order[q.id]=shuffle(_a); }
    var order = s.order[q.id];
    var opts = '<div class="opts">'+ order.map(function(origIdx,slot){
      return '<button class="opt" data-i="'+origIdx+'"><span class="k">'+LETTERS[slot]+'</span><span class="tx">'+esc(q.options[origIdx])+'</span><span class="mk"></span></button>';
    }).join('') +'</div>';
    var visual = q.svg ? '<div class="svgwrap">'+q.svg+'</div>' : '';   // trusted inline SVG from the bank
    var card = el('<div class="qcard">'+head+'<p class="qtext">'+esc(q.question)+'</p>'+visual+opts+'<div class="after"></div></div>');
    app.innerHTML=''; app.appendChild(card);
    [].forEach.call(card.querySelectorAll('.opt'), function(b){
      b.onclick=function(){ answer(parseInt(b.getAttribute('data-i'),10)); };
    });
  }

  function answer(i){
    var s=session; if(s.answered) return; s.answered=true;
    var q=s.queue[s.idx], correct=(i===q.correct_index);
    recordAnswer(q.id, correct);
    if(correct) s.right++; else s.wrong++;
    var btns = app.querySelectorAll('.opt');
    [].forEach.call(btns, function(b){
      var bi=parseInt(b.getAttribute('data-i'),10);
      b.classList.add('locked');
      if(bi===q.correct_index){ b.classList.add('correct'); b.querySelector('.mk').textContent='✓'; }
      else if(bi===i){ b.classList.add('wrong'); b.querySelector('.mk').textContent='✗'; }
      else b.classList.add('dim');
    });
    // in the exam we still teach (show why), but keep it tight
    var after = app.querySelector('.after');
    var corrSlot = (s.order && s.order[q.id]) ? s.order[q.id].indexOf(q.correct_index) : q.correct_index;
    var why = '<div class="why"><div class="ct">'+(correct?'✓ WHY YOU\'RE RIGHT':'✗ WHY THE ANSWER IS '+LETTERS[corrSlot])+'</div><p>'+esc(q.why)+'</p></div>';
    var debate = (q.debate && q.debate.length) ? '<div class="debate"><div class="ct">HOW THE PROS SEE IT</div>'+
      q.debate.map(function(d){ return '<div class="lens"><span class="who">'+esc(d.author)+'</span><span class="stance">'+esc(d.stance)+'</span></div>'; }).join('')+
      '</div>' : '';
    var rh = q.rh_note ? '<div class="rhnote"><div class="ct">YOUR $6K / ROBINHOOD</div><p>'+esc(q.rh_note)+'</p></div>' : '';
    var last = (s.idx>=s.queue.length-1);
    var controls = '<div class="controls">'+
      '<button class="btn ghost" id="quit">Home</button>'+
      '<button class="btn" id="next">'+(last?'See Results':'Next →')+'</button>'+
    '</div>';
    after.innerHTML = why + debate + rh + controls;
    document.getElementById('next').onclick = next;
    document.getElementById('quit').onclick = function(){ renderHome(); };
    after.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  function next(){
    var s=session;
    if(s.idx>=s.queue.length-1){ renderResults(); return; }
    s.idx++; renderQuestion();
  }

  function gradeLetter(pct){
    if(pct>=90) return ['A','a']; if(pct>=80) return ['B','b']; if(pct>=70) return ['C','c'];
    if(pct>=60) return ['D','d']; return ['F','f'];
  }

  function renderResults(){
    var s=session; setProgress(100);
    var total=s.right+s.wrong, pct = total? Math.round(s.right/total*100):0;
    var g = gradeLetter(pct);
    if(s.exam){ ST.exam = Math.max(ST.exam||0, pct); saveState(ST); }
    var bench = s.exam
      ? '<div class="bench"><div class="ct">PRO BENCHMARK</div><p>'+esc(META.pro_benchmark)+'</p></div>' : '';
    var title = s.exam ? 'FINAL EXAM' : (s.mode==='review'?'REVIEW DONE':(s.mode==='module'?(MODBY[s.modId]||{}).name+' DONE':'QUIZ DONE'));
    var msg;
    if(pct>=90) msg='Pro-level. This is the money zone.';
    else if(pct>=75) msg='Strong. Drill the misses and you\'re dangerous.';
    else if(pct>=50) msg='Getting there — Review Misses will close the gap fast.';
    else msg='Early days. Run the modules in order; the why-notes do the teaching.';
    app.innerHTML =
      '<div class="results">'+
        '<p class="crumb mono" style="color:var(--cyan)">'+esc(title)+'</p>'+
        '<div class="grade '+g[1]+'">'+g[0]+'</div>'+
        '<p class="sc">You scored <b>'+s.right+' / '+total+'</b> &nbsp;·&nbsp; <b>'+pct+'%</b></p>'+
        '<p class="tagline" style="margin-top:8px">'+esc(msg)+'</p>'+
        bench+
        '<div class="controls" style="margin-top:18px">'+
          '<button class="btn ghost" id="home">Home</button>'+
          (reviewQueue().length?'<button class="btn amb" id="rev">Review '+reviewQueue().length+' misses</button>':'')+
          '<button class="btn" id="again">'+(s.exam?'Retake Exam':'Go Again')+'</button>'+
        '</div>'+
      '</div>';
    document.getElementById('home').onclick=function(){ renderHome(); };
    document.getElementById('again').onclick=function(){ startSession(s.mode, s.modId); };
    var rv=document.getElementById('rev'); if(rv) rv.onclick=function(){ startSession('review'); };
  }

            '<div class="calc-field"><label>Spot ($)</label><input type="number" id="gi-spot" min="0" step="0.01" value="100"/></div>'+
            '<div class="calc-field"><label>Strike ($)</label><input type="number" id="gi-strike" min="0" step="0.01" value="100"/></div>'+
            '<div class="calc-field"><label>Premium paid ($)</label><input type="number" id="gi-prem" min="0" step="0.01" value="3"/></div>'+
            '<div class="calc-field"><label>IV (%)</label><input type="number" id="gi-iv" min="0" step="0.1" value="35"/></div>'+
            '<div class="calc-field"><label>DTE (days)</label><input type="number" id="gi-dte" min="1" step="1" value="30"/></div>'+
          '</div>'+
          '<div class="grid-wrap"><div id="grid-table"></div></div>'+
          '<div class="gridlegend">'+
            '<span><span class="sw" style="background:#1b9e54"></span><b>profit</b></span>'+
            '<span><span class="sw" style="background:#c0392b"></span><b>loss</b></span>'+
            '<span><span class="sw" style="border:2px dashed var(--amber)"></span><b>breakeven</b></span>'+
            '<span><span class="sw" style="box-shadow:inset 3px 0 var(--red),inset -3px 0 var(--red);background:#222"></span><b>theta cliff (21 DTE)</b></span>'+
          '</div>'+
          '<div class="calc-out" id="grid-out" style="margin-top:12px"></div>'+
        '</div>'+
      '</div>';

    // G) MULTI-LEG PAYOFF builder (expiration P/L for spreads / straddles / condors)
    var multileg =
      '<div class="ref-section">'+
        '<div class="lbl">Multi-Leg Payoff Builder</div>'+
        '<div class="ref-card" style="border-left-color:var(--purple,#a371f7)">'+
          '<div class="rt">EXPIRATION P/L FOR THE STRUCTURE — BREAKEVENS, MAX WIN, MAX LOSS</div>'+
          '<p style="font-size:13px">Picture the trade before you place it. A spread caps both your cost and your upside; a condor pays you to bet on a range. The dashed lines are breakevens; the blue tick is the current price.</p>'+
          '<select class="ml-select" id="ml-kind" style="margin-bottom:10px">'+
            '<option value="long-call">Long Call</option>'+
            '<option value="long-put">Long Put</option>'+
            '<option value="bull-call">Bull Call (debit) Spread</option>'+
            '<option value="bear-put">Bear Put (debit) Spread</option>'+
            '<option value="straddle">Long Straddle</option>'+
            '<option value="strangle">Long Strangle</option>'+
            '<option value="iron-condor">Iron Condor (credit)</option>'+
          '</select>'+
          '<div class="calc-grid">'+
            '<div class="calc-field"><label>Spot ($)</label><input type="number" id="ml-spot" min="0" step="0.01" value="100"/></div>'+
            '<div class="calc-field" id="mlf-a"><label>Strike A (lower)</label><input type="number" id="ml-a" min="0" step="0.01" value="100"/></div>'+
            '<div class="calc-field" id="mlf-b"><label>Strike B (upper)</label><input type="number" id="ml-b" min="0" step="0.01" value="110"/></div>'+
            '<div class="calc-field" id="mlf-net"><label>Net debit(+)/credit(&minus;) $</label><input type="number" id="ml-net" step="0.01" value="3"/></div>'+
            '<div class="calc-field" id="mlf-wing"><label>Wing width ($)</label><input type="number" id="ml-wing" min="0" step="0.5" value="5"/></div>'+
          '</div>'+
          '<div class="payoff-wrap"><div id="payoff-svg"></div></div>'+
          '<div class="calc-out" id="ml-out" style="margin-top:10px"></div>'+
        '</div>'+
      '</div>';

    app.innerHTML =
      backBtn+
      '<div class="hero">'+
        '<p class="crumb">REFERENCE · TEXTBOOK MODE</p>'+
        '<h1 style="font-size:clamp(22px,7vw,38px)">Vol, Greeks<br>&amp; the Pros</h1>'+
        '<p class="tagline">No quiz — just the concepts, visualized. Tap a calculator number to get a live read.</p>'+
      '</div>'+
      primer + thetaSvg + ivhvBar + proTable + calc + grid + multileg +
      backBtnBot +
      '<div class="foot" style="margin-top:16px">REFERENCE SECTION · educational only · not financial advice</div>';

    document.getElementById('ref-back').onclick = function(){ renderHome(); };
    document.getElementById('ref-back2').onclick = function(){ renderHome(); };

    // calculator logic
    function calcUpdate(){
      var spot  = parseFloat(document.getElementById('ci-spot').value);
      var strad = parseFloat(document.getElementById('ci-strad').value);
      var iv    = parseFloat(document.getElementById('ci-iv').value);
      var hv    = parseFloat(document.getElementById('ci-hv').value);
      var debit = parseFloat(document.getElementById('ci-debit').value);
      var hist  = parseFloat(document.getElementById('ci-hist').value);
      var out   = document.getElementById('calc-out');
      if(!out) return;

      function fmt(n, dec){ return isNaN(n)||!isFinite(n) ? '&mdash;' : n.toFixed(dec!=null?dec:2); }
      function fmtPct(n){ return isNaN(n)||!isFinite(n) ? '&mdash;' : n.toFixed(1)+'%'; }
      function fmtD(n){ return isNaN(n)||!isFinite(n) ? '&mdash;' : '$'+n.toFixed(2); }

      var expMovePct = (spot>0 && strad>0) ? strad/spot*100 : NaN;
      var upBe = (spot>0 && strad>0) ? spot+strad : NaN;
      var dnBe = (spot>0 && strad>0) ? spot-strad : NaN;

      var ivhvRatio = (iv>0 && hv>0) ? iv/hv : NaN;
      var verdictHtml = '&mdash;';
      if(!isNaN(ivhvRatio)){
        if(ivhvRatio<=0.85) verdictHtml = fmt(ivhvRatio,2)+'<span class="verdict-chip cheap">CHEAP &mdash; buyer\'s edge</span>';
        else if(ivhvRatio>=1.20) verdictHtml = fmt(ivhvRatio,2)+'<span class="verdict-chip rich">RICH &mdash; seller\'s edge</span>';
        else verdictHtml = fmt(ivhvRatio,2)+'<span class="verdict-chip fair">FAIR</span>';
      }

      var edgeHtml = '&mdash;';
      if(!isNaN(hist) && hist>0 && !isNaN(expMovePct) && expMovePct>0){
        var edgeR = hist/expMovePct;
        if(edgeR>1) edgeHtml = fmt(edgeR,2)+'<span class="verdict-chip cheap">MOVE IS CHEAP</span>';
        else edgeHtml = fmt(edgeR,2)+'<span class="verdict-chip rich">OVERPRICED</span>';
      }

      var t1 = (debit>0) ? debit*1.5 : NaN;
      var stop = (debit>0) ? debit*0.5 : NaN;

      out.innerHTML =
        '<div class="calc-row"><span class="ck">Expected move</span><span class="cv">'+fmtD(strad)+' / '+fmtPct(expMovePct)+'</span></div>'+
        '<div class="calc-row"><span class="ck">UP breakeven</span><span class="cv">'+fmtD(upBe)+'</span></div>'+
        '<div class="calc-row"><span class="ck">DOWN breakeven</span><span class="cv">'+fmtD(dnBe)+'</span></div>'+
        '<div class="calc-row"><span class="ck">IV / HV ratio</span><span class="cv">'+verdictHtml+'</span></div>'+
        '<div class="calc-row"><span class="ck">Historical edge ratio</span><span class="cv">'+edgeHtml+'</span></div>'+
        '<div class="calc-row"><span class="ck">T1 exit (+50%) &mdash; sell half</span><span class="cv">'+fmtD(t1)+'</span></div>'+
        '<div class="calc-row"><span class="ck">Stop (&minus;50%) &mdash; exit all</span><span class="cv">'+fmtD(stop)+'</span></div>';
    }

    [].forEach.call(app.querySelectorAll('input[id^="ci-"]'), function(inp){
      inp.oninput = calcUpdate;
    });
    calcUpdate();

    // ---- shared math: normal CDF (Abramowitz-Stegun) + Black-Scholes (r=0) ----
    function ncdf(x){
      var t=1/(1+0.2316419*Math.abs(x));
      var d=0.3989422804014327*Math.exp(-x*x/2);
      var p=d*t*(0.31938153+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
      return x>=0 ? 1-p : p;
    }
    function bsVal(S,K,T,sig,type){
      var intr = Math.max(0, type==='call' ? S-K : K-S);
      if(T<=0 || sig<=0 || S<=0 || K<=0) return intr;
      var srt=sig*Math.sqrt(T);
      var d1=(Math.log(S/K)+0.5*sig*sig*T)/srt, d2=d1-srt;
      return type==='call' ? S*ncdf(d1)-K*ncdf(d2) : K*ncdf(-d2)-S*ncdf(-d1);
    }
    function plColor(plpc){ // plpc = P/L as fraction of premium
      var x=Math.max(-1,Math.min(2,plpc));
      if(x>=0){ var a=Math.min(1, x/1.5); return 'rgb('+Math.round(40-10*a)+','+Math.round(120+58*a)+','+Math.round(70+10*a)+')'; }
      var b=Math.min(1, -x); return 'rgb('+Math.round(120+72*b)+','+Math.round(70-25*b)+','+Math.round(55-15*b)+')';
    }

    // ---- F) CONTRACT P/L GRID ----
    var gType='call';
    function gridUpdate(){
      var spot=parseFloat(document.getElementById('gi-spot').value),
          K=parseFloat(document.getElementById('gi-strike').value),
          prem=parseFloat(document.getElementById('gi-prem').value),
          ivp=parseFloat(document.getElementById('gi-iv').value),
          dte=parseInt(document.getElementById('gi-dte').value,10);
      var tbl=document.getElementById('grid-table'), out=document.getElementById('grid-out');
      if(!tbl) return;
      if(!(spot>0&&K>0&&prem>0&&ivp>0&&dte>0)){ tbl.innerHTML='<p style="color:var(--mut);font-family:var(--mono);font-size:12px;padding:8px">Enter spot, strike, premium, IV, DTE…</p>'; out.innerHTML=''; return; }
      var sig=ivp/100, type=gType;
      var move=spot*sig*Math.sqrt(dte/365)*2; if(!(move>0)) move=spot*0.15;
      var rows=11, prices=[]; for(var r=0;r<rows;r++){ prices.push(spot+move*(1-2*r/(rows-1))); }
      var ncol=Math.min(8,dte+1), days=[]; for(var c=0;c<ncol;c++){ days.push(Math.round(dte-dte*c/(ncol-1))); }
      var be = type==='call' ? K+prem : K-prem;
      var h='<table class="plgrid"><thead><tr><th>price \\ DTE</th>';
      for(var c=0;c<ncol;c++){ var cliff=days[c]<=21&&days[c]>0; h+='<th class="'+(cliff?'colcliff':'')+'">'+days[c]+'d</th>'; }
      h+='</tr></thead><tbody>';
      var step=move/(rows-1);
      for(var r=0;r<rows;r++){
        var P=prices[r], nearSpot=Math.abs(P-spot)<step/2+1e-9;
        h+='<tr><td class="rowhdr'+(nearSpot?' spot':'')+'">$'+P.toFixed(2)+(nearSpot?' ◀':'')+'</td>';
        for(var c=0;c<ncol;c++){
          var T=days[c]/365, val=bsVal(P,K,T,sig,type), pl=val-prem, plpc=pl/prem;
          var beCell=(r<rows-1)&&((prices[r]-be)*(prices[r+1]-be)<=0);
          h+='<td class="cell'+(beCell?' be':'')+'" style="background:'+plColor(plpc)+'" title="$'+pl.toFixed(2)+'/sh value $'+val.toFixed(2)+'">'+(pl>=0?'+':'')+(plpc*100).toFixed(0)+'%</td>';
        }
        h+='</tr>';
      }
      tbl.innerHTML=h+'</tbody></table>';
      // POP + expected move + the 3 exit marks
      var T0=dte/365, srt=sig*Math.sqrt(T0);
      var pop = type==='call' ? ncdf((Math.log(spot/be)-0.5*sig*sig*T0)/srt)
                              : ncdf((Math.log(be/spot)+0.5*sig*sig*T0)/srt);
      var oneSig=spot*sig*Math.sqrt(T0);
      var needPct=Math.abs(be-spot)/spot*100, sigPct=oneSig/spot*100;
      var fav = needPct<=sigPct;
      var t1=prem*1.5, stop=prem*0.5, cliffD=Math.min(21,dte);
      out.innerHTML=
        '<div class="calc-row"><span class="ck">Breakeven price</span><span class="cv">$'+be.toFixed(2)+'</span></div>'+
        '<div class="calc-row"><span class="ck">Need to BE</span><span class="cv">'+(be>=spot?'+':'')+ (((be-spot)/spot)*100).toFixed(1)+'%</span></div>'+
        '<div class="calc-row"><span class="ck">Expected 1σ move</span><span class="cv">±'+sigPct.toFixed(1)+'% (±$'+oneSig.toFixed(2)+')</span></div>'+
        '<div class="calc-row"><span class="ck">Move vs priced-in</span><span class="cv">'+(fav?'<span class="verdict-chip cheap">FAVORABLE</span>':'<span class="verdict-chip rich">STIFF</span>')+'</span></div>'+
        '<div class="calc-row"><span class="ck">POP (finish past BE)</span><span class="cv">'+(pop*100).toFixed(0)+'%</span></div>'+
        '<div class="calc-row"><span class="ck">T1 — sell half at +50%</span><span class="cv">$'+t1.toFixed(2)+'</span></div>'+
        '<div class="calc-row"><span class="ck">Stop — out at −50%</span><span class="cv">$'+stop.toFixed(2)+'</span></div>'+
        '<div class="calc-row"><span class="ck">Theta cliff — exit by</span><span class="cv">'+cliffD+' DTE</span></div>'+
        '<div style="font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.5">POP on a long option is usually under 50% — the edge is the <b style="color:var(--ink)">payoff</b> (winners run +50/+100%, losses capped at the stop), not the hit-rate. If POP is low AND the move is STIFF, the contract is a lottery ticket — move closer to the money or pass.</div>';
    }
    [].forEach.call(app.querySelectorAll('#g-type .subtab'), function(b){
      b.onclick=function(){ gType=b.getAttribute('data-t');
        [].forEach.call(app.querySelectorAll('#g-type .subtab'),function(x){x.classList.remove('on');});
        b.classList.add('on'); gridUpdate(); };
    });
    [].forEach.call(app.querySelectorAll('input[id^="gi-"]'), function(inp){ inp.oninput=gridUpdate; });
    gridUpdate();

    // ---- G) MULTI-LEG PAYOFF ----
    function mlLegs(kind,A,B,wing){
      switch(kind){
        case 'long-call': return [[1,'call',A]];
        case 'long-put': return [[1,'put',A]];
        case 'bull-call': return [[1,'call',A],[-1,'call',B]];
        case 'bear-put': return [[1,'put',B],[-1,'put',A]];
        case 'straddle': return [[1,'call',A],[1,'put',A]];
        case 'strangle': return [[1,'put',A],[1,'call',B]];
        case 'iron-condor': return [[-1,'put',A],[1,'put',A-wing],[-1,'call',B],[1,'call',B+wing]];
      }
      return [[1,'call',A]];
    }
    function mlPayoff(legs,net,P){
      var sv=0; for(var i=0;i<legs.length;i++){ var L=legs[i], intr=L[1]==='call'?Math.max(0,P-L[2]):Math.max(0,L[2]-P); sv+=L[0]*intr; }
      return sv-net; // net>0 = debit paid; net<0 = credit received
    }
    function mlSync(){
      var kind=document.getElementById('ml-kind').value;
      var showB = (kind==='bull-call'||kind==='bear-put'||kind==='strangle'||kind==='iron-condor');
      var showWing = (kind==='iron-condor');
      document.getElementById('mlf-b').style.display = showB?'':'none';
      document.getElementById('mlf-wing').style.display = showWing?'':'none';
      var lblA=document.querySelector('#mlf-a label'), lblNet=document.querySelector('#mlf-net label');
      lblA.innerHTML = (kind==='iron-condor')?'Short put strike':(showB?'Strike A (lower)':'Strike');
      lblNet.innerHTML = (kind==='iron-condor')?'Net credit (enter &minus;)':'Net debit(+)/credit(&minus;) $';
    }
    function mlUpdate(){
      var kind=document.getElementById('ml-kind').value,
          spot=parseFloat(document.getElementById('ml-spot').value),
          A=parseFloat(document.getElementById('ml-a').value),
          B=parseFloat(document.getElementById('ml-b').value),
          net=parseFloat(document.getElementById('ml-net').value),
          wing=parseFloat(document.getElementById('ml-wing').value);
      var box=document.getElementById('payoff-svg'), out=document.getElementById('ml-out');
      if(!box) return;
      if(isNaN(A)||isNaN(net)||isNaN(spot)){ box.innerHTML=''; out.innerHTML='<p style="color:var(--mut);font-family:var(--mono);font-size:12px">Fill the inputs…</p>'; return; }
      if(isNaN(B)) B=A; if(isNaN(wing)) wing=5;
      var legs=mlLegs(kind,A,B,wing);
      var strikes=legs.map(function(L){return L[2];});
      var lo=Math.min.apply(null,strikes.concat([spot]))*0.78, hi=Math.max.apply(null,strikes.concat([spot]))*1.22;
      if(!(hi>lo)){ lo=spot*0.8; hi=spot*1.2; }
      var N=140, xs=[], ys=[], maxP=-1e9, minP=1e9;
      for(var i=0;i<=N;i++){ var P=lo+(hi-lo)*i/N, y=mlPayoff(legs,net,P); xs.push(P); ys.push(y); if(y>maxP)maxP=y; if(y<minP)minP=y; }
      // breakevens = zero crossings
      var bes=[]; for(var i=0;i<N;i++){ if(ys[i]===0) bes.push(xs[i]); else if(ys[i]*ys[i+1]<0){ var t=ys[i]/(ys[i]-ys[i+1]); bes.push(xs[i]+(xs[i+1]-xs[i])*t); } }
      // SVG geometry
      var X0=44,X1=312,Y0=18,Y1=168;
      var pad=(maxP-minP)*0.12||1; var yhi=maxP+pad, ylo=minP-pad;
      function sx(P){ return X0+(P-lo)/(hi-lo)*(X1-X0); }
      function sy(y){ return Y1-(y-ylo)/(yhi-ylo)*(Y1-Y0); }
      var zeroY=sy(0);
      var s='<svg viewBox="0 0 320 188" xmlns="http://www.w3.org/2000/svg" aria-label="payoff at expiration">';
      s+='<line x1="'+X0+'" y1="'+Y0+'" x2="'+X0+'" y2="'+Y1+'" stroke="rgba(39,50,63,.9)"/>';
      s+='<line x1="'+X0+'" y1="'+zeroY.toFixed(1)+'" x2="'+X1+'" y2="'+zeroY.toFixed(1)+'" stroke="#6b7785" stroke-dasharray="3,3"/>';
      s+='<text x="2" y="'+(Y0+8)+'" font-family="monospace" font-size="8" fill="#3fb950">+$'+maxP.toFixed(2)+'</text>';
      s+='<text x="2" y="'+(Y1)+'" font-family="monospace" font-size="8" fill="#f85149">'+ (minP<0?'-$'+Math.abs(minP).toFixed(2):'+$'+minP.toFixed(2))+'</text>';
      s+='<text x="'+(X1-2)+'" y="'+(zeroY-3).toFixed(1)+'" text-anchor="end" font-family="monospace" font-size="8" fill="#6b7785">$0 P/L</text>';
      // sign-split payoff line
      for(var i=0;i<N;i++){
        var ya=ys[i], yb=ys[i+1], xa=xs[i], xb=xs[i+1];
        if(ya*yb<0){ var t=ya/(ya-yb), xc=xa+(xb-xa)*t;
          s+='<line x1="'+sx(xa).toFixed(1)+'" y1="'+sy(ya).toFixed(1)+'" x2="'+sx(xc).toFixed(1)+'" y2="'+sy(0).toFixed(1)+'" stroke="'+(ya>=0?'#3fb950':'#f85149')+'" stroke-width="2"/>';
          s+='<line x1="'+sx(xc).toFixed(1)+'" y1="'+sy(0).toFixed(1)+'" x2="'+sx(xb).toFixed(1)+'" y2="'+sy(yb).toFixed(1)+'" stroke="'+(yb>=0?'#3fb950':'#f85149')+'" stroke-width="2"/>';
        } else {
          s+='<line x1="'+sx(xa).toFixed(1)+'" y1="'+sy(ya).toFixed(1)+'" x2="'+sx(xb).toFixed(1)+'" y2="'+sy(yb).toFixed(1)+'" stroke="'+(ya>=0?'#3fb950':'#f85149')+'" stroke-width="2"/>';
        }
      }
      // breakevens + spot
      bes.forEach(function(be){ var x=sx(be); s+='<line x1="'+x.toFixed(1)+'" y1="'+Y0+'" x2="'+x.toFixed(1)+'" y2="'+Y1+'" stroke="var(--amber)" stroke-dasharray="2,3" opacity=".8"/>'+
        '<text x="'+x.toFixed(1)+'" y="'+(Y1+9)+'" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#ffb020">$'+be.toFixed(0)+'</text>'; });
      var xspot=sx(spot); s+='<line x1="'+xspot.toFixed(1)+'" y1="'+Y0+'" x2="'+xspot.toFixed(1)+'" y2="'+Y1+'" stroke="var(--cyan)" stroke-width="1.2"/>'+
        '<text x="'+xspot.toFixed(1)+'" y="'+(Y0-3>10?Y0+0:Y0)+'" font-family="monospace" font-size="0" fill="none"></text>'+
        '<text x="'+Math.min(X1-20,xspot+2).toFixed(1)+'" y="'+(Y0+8)+'" font-family="monospace" font-size="8" fill="#36d6e7">spot $'+spot.toFixed(0)+'</text>';
      s+='</svg>';
      box.innerHTML=s;
      var beTxt = bes.length? bes.map(function(b){return '$'+b.toFixed(2);}).join(' / ') : 'none in range';
      var risk = net>0 ? '$'+(net*100).toFixed(0)+' debit' : '$'+(Math.abs(net)*100).toFixed(0)+' credit';
      out.innerHTML=
        '<div class="calc-row"><span class="ck">Cost basis</span><span class="cv">'+risk+'/contract</span></div>'+
        '<div class="calc-row"><span class="ck">Max profit</span><span class="cv pnl-pos">+$'+(maxP*100).toFixed(0)+'</span></div>'+
        '<div class="calc-row"><span class="ck">Max loss</span><span class="cv pnl-neg">'+(minP<0?'-$'+Math.abs(minP*100).toFixed(0):'+$'+(minP*100).toFixed(0))+'</span></div>'+
        '<div class="calc-row"><span class="ck">Breakeven(s)</span><span class="cv">'+beTxt+'</span></div>'+
        '<div class="calc-row"><span class="ck">Risk : reward</span><span class="cv">'+((maxP>0&&minP<0)?'1 : '+(maxP/Math.abs(minP)).toFixed(2):'—')+'</span></div>';
    }
    document.getElementById('ml-kind').onchange=function(){ mlSync(); mlUpdate(); };
    [].forEach.call(app.querySelectorAll('input[id^="ml-"]'), function(inp){ inp.oninput=mlUpdate; });
    mlSync(); mlUpdate();
  }

  // keyboard: 1-4 answer, Enter/Space = next
  document.addEventListener('keydown', function(e){
    if(!session) return;
    if(!session.answered && /^[1-4]$/.test(e.key)){
      var i=parseInt(e.key,10)-1; var b=app.querySelectorAll('.opt')[i]; if(b){ e.preventDefault(); b.click(); }
    } else if(session.answered && (e.key==='Enter'||e.key===' ')){
      var nx=document.getElementById('next'); if(nx){ e.preventDefault(); nx.click(); }
    }
  });

  renderHome();
})();
</script>
