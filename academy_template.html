<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b10">
<title>Options Trading Academy</title>
<style>
:root{
  --bg:#070b10; --panel:#0e141c; --panel2:#131b25; --steel:#1a2530; --ink:#e9eef4; --mut:#8593a1;
  --line:#27323f; --line2:#324252;
  --amber:#ffb020; --amber2:#ffd479; --green:#3fb950; --red:#f85149; --blue:#58a6ff; --cyan:#36d6e7;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,"Courier New",monospace;
  --disp:Bahnschrift,"Segoe UI Semibold","Arial Narrow",Arial,sans-serif;
  --body:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:17px; line-height:1.55; -webkit-text-size-adjust:100%;
  background-image:
    radial-gradient(ellipse 90% 45% at 50% -8%, rgba(54,214,231,.07), transparent 70%),
    radial-gradient(ellipse 70% 40% at 50% 105%, rgba(255,176,32,.05), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(54,214,231,.018) 3px 4px);
  background-attachment:fixed;
}
.wrap{max-width:760px; margin:0 auto; padding:18px 14px 90px; position:relative; z-index:1}
button{font-family:inherit}
.mono{font-family:var(--mono)}

/* top progress bar */
#topbar{position:sticky; top:0; z-index:50; height:5px; background:rgba(7,11,16,.9);
  border-bottom:1px solid var(--line2)}
#topbar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--blue));
  box-shadow:0 0 10px rgba(54,214,231,.5); transition:width .25s}

/* HERO */
.hero{position:relative; border:1px solid var(--line2); border-radius:10px; overflow:hidden;
  background:linear-gradient(160deg,#0c1622,#0a121b 60%,#0b0f15); padding:16px 16px 18px; margin-top:10px;
  box-shadow:inset 0 0 40px rgba(54,214,231,.06)}
.hero::after{content:""; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--cyan),transparent 60%)}
.crumb{font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--cyan); margin:0 0 4px}
h1{font-family:var(--disp); font-size:clamp(28px,8vw,46px); line-height:.98; text-transform:uppercase;
  letter-spacing:.01em; margin:0}
h1 .n{color:var(--amber)}
.tagline{color:var(--mut); font-size:14px; margin:8px 0 0}
.tagline b{color:var(--amber2)}

/* readout chips */
.readout{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.stat{flex:1 1 90px; min-width:84px; border:1px solid var(--line); border-left:3px solid var(--cyan);
  background:rgba(54,214,231,.04); border-radius:0 5px 5px 0; padding:7px 10px}
.stat .v{font-family:var(--disp); font-size:22px; line-height:1; color:var(--ink)}
.stat .l{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--mut); margin-top:3px; text-transform:uppercase}
.stat.amb{border-left-color:var(--amber); background:rgba(255,176,32,.05)} .stat.amb .v{color:var(--amber2)}
.stat.grn{border-left-color:var(--green); background:rgba(63,185,80,.05)} .stat.grn .v{color:var(--green)}

/* section label */
.lbl{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--mut); text-transform:uppercase;
  margin:26px 0 10px; display:flex; align-items:center; gap:8px}
.lbl::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line2),transparent)}

/* mode buttons */
.modes{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.mode{display:flex; flex-direction:column; gap:3px; text-align:left; cursor:pointer; color:var(--ink);
  border:1px solid var(--line2); border-left:3px solid var(--blue); border-radius:7px; padding:11px 12px;
  background:linear-gradient(110deg,var(--panel2),var(--panel) 75%); transition:border-color .12s, box-shadow .12s}
.mode:hover,.mode:focus{border-left-color:var(--cyan); box-shadow:0 0 14px rgba(54,214,231,.12); outline:none}
.mode .t{font-family:var(--disp); font-size:16px; letter-spacing:.02em}
.mode .d{font-size:12px; color:var(--mut); line-height:1.35}
.mode.exam{border-left-color:var(--amber)} .mode.exam .t{color:var(--amber2)}

/* module cards */
.mods{display:grid; grid-template-columns:1fr; gap:9px; margin-top:4px}
@media(min-width:560px){ .mods{grid-template-columns:1fr 1fr} }
.modcard{display:block; text-align:left; cursor:pointer; color:var(--ink); width:100%;
  border:1px solid var(--line2); border-left:3px solid var(--cyan); border-radius:7px; padding:11px 12px;
  background:linear-gradient(110deg,var(--panel2),var(--panel) 70%); transition:border-color .12s, box-shadow .12s}
.modcard:hover,.modcard:focus{border-left-color:var(--amber); box-shadow:0 0 14px rgba(54,214,231,.1); outline:none}
.modcard .h{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.modcard .nm{font-family:var(--disp); font-size:16px; letter-spacing:.02em}
.modcard .pct{font-family:var(--mono); font-size:12px; color:var(--cyan)}
.modcard .bl{font-size:12px; color:var(--mut); line-height:1.35; margin:4px 0 8px}
.pbar{height:6px; border-radius:3px; background:var(--steel); overflow:hidden; border:1px solid var(--line)}
.pbar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--green),var(--cyan))}

/* QUESTION card */
.qcard{border:1px solid var(--line2); border-radius:10px; background:var(--panel); padding:15px 15px 16px; margin-top:12px}
.qmeta{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-bottom:11px}
.chip{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--bg);
  background:var(--cyan); padding:2px 8px; border-radius:3px}
.chip.lv{background:var(--blue)} .chip.lv.l2{background:var(--amber)} .chip.lv.l3{background:var(--red)}
.qcount{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--mut)}
.qtext{font-family:var(--disp); font-size:20px; line-height:1.3; margin:0 0 14px}
.opts{display:flex; flex-direction:column; gap:8px}
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%; cursor:pointer; color:var(--ink);
  border:1px solid var(--line2); border-radius:7px; padding:11px 12px; min-height:48px;
  background:var(--panel2); transition:border-color .12s, background .12s; font-size:15px; line-height:1.4}
.opt:hover:not(.locked){border-color:var(--cyan)}
.opt .k{font-family:var(--mono); font-size:13px; color:var(--mut); flex-shrink:0; width:16px}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--green); background:rgba(63,185,80,.12)} .opt.correct .k{color:var(--green)}
.opt.wrong{border-color:var(--red); background:rgba(248,81,73,.12)} .opt.wrong .k{color:var(--red)}
.opt.dim{opacity:.5}
.opt .mk{margin-left:auto; font-weight:bold; flex-shrink:0}
.opt.correct .mk{color:var(--green)} .opt.wrong .mk{color:var(--red)}

/* why + rh note */
.why{border:1px solid var(--blue); border-left:3px solid var(--blue); border-radius:8px; padding:11px 13px; margin-top:13px;
  background:linear-gradient(180deg,rgba(88,166,255,.08),rgba(88,166,255,.02))}
.why .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--blue); margin-bottom:5px}
.why p{margin:0; font-size:14px; line-height:1.5; color:var(--ink)}
.rhnote{border:1px solid var(--amber); border-left:3px solid var(--amber); border-radius:8px; padding:10px 13px; margin-top:9px;
  background:linear-gradient(180deg,rgba(255,176,32,.09),rgba(255,176,32,.02))}
.rhnote .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--amber); margin-bottom:4px}
.rhnote p{margin:0; font-size:13.5px; line-height:1.45; color:var(--amber2)}

/* controls */
.controls{display:flex; gap:9px; margin-top:15px; flex-wrap:wrap}
.btn{flex:1 1 auto; min-height:48px; cursor:pointer; font-family:var(--disp); font-size:16px; letter-spacing:.03em;
  color:var(--bg); background:var(--cyan); border:none; border-radius:7px; padding:11px 16px;
  box-shadow:0 0 14px rgba(54,214,231,.25)}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--ink); background:transparent; border:1px solid var(--line2); box-shadow:none; flex:0 0 auto}
.btn.ghost:hover{border-color:var(--cyan)}
.btn.amb{background:var(--amber); color:#1a1206}

/* results */
.results{border:1px solid var(--line2); border-radius:10px; background:var(--panel); padding:20px 16px; margin-top:14px; text-align:center}
.grade{font-family:var(--disp); font-size:clamp(54px,18vw,90px); line-height:1; margin:6px 0}
.grade.a{color:var(--green)} .grade.b{color:var(--cyan)} .grade.c{color:var(--amber2)} .grade.d{color:var(--amber)} .grade.f{color:var(--red)}
.results .sc{font-family:var(--mono); font-size:15px; color:var(--mut)}
.results .sc b{color:var(--ink)}
.bench{border:1px solid var(--amber); border-radius:8px; padding:11px 13px; margin:15px 0 4px; text-align:left;
  background:linear-gradient(180deg,rgba(255,176,32,.08),rgba(255,176,32,.02))}
.bench .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--amber); margin-bottom:5px}
.bench p{margin:0; font-size:13.5px; line-height:1.5; color:var(--ink)}
.empty{border:1px dashed var(--line2); border-radius:8px; padding:18px; text-align:center; color:var(--mut); margin-top:14px; font-size:14px}
.foot{margin-top:30px; font-family:var(--mono); font-size:10.5px; color:var(--mut); text-align:center; letter-spacing:.06em; line-height:1.6}
</style>
</head>
<body>
<div id="topbar"><i id="topbarfill"></i></div>
<div class="wrap" id="app"></div>

<script>const BANK = /*__BANK__*/;</script>
<script>
(function(){
  "use strict";
  var QS = BANK.questions, META = BANK.meta;
  var MODS = META.modules, MODBY = {}; MODS.forEach(function(m){ MODBY[m.id]=m; });
  var LETTERS = ["A","B","C","D"];
  var KEY = "oac_v1";

  // ---- state (localStorage) ----
  function loadState(){
    try{ var s = JSON.parse(localStorage.getItem(KEY)||"{}"); s.boxes=s.boxes||{}; s.stats=s.stats||{right:0,wrong:0}; return s; }
    catch(e){ return {boxes:{},stats:{right:0,wrong:0}}; }
  }
  function saveState(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
  var ST = loadState();

  // box: 1..5 (higher = better known). unseen = undefined.
  function box(id){ return ST.boxes[id]; }
  function recordAnswer(id, correct){
    var prev = ST.boxes[id]==null ? 2 : ST.boxes[id];
    ST.boxes[id] = correct ? Math.min(prev+1,5) : 1;
    if(correct) ST.stats.right++; else ST.stats.wrong++;
    saveState(ST);
  }
  function masteryPct(modId){
    var inMod = QS.filter(function(q){return q.module===modId;});
    if(!inMod.length) return 0;
    var mastered = inMod.filter(function(q){ return (ST.boxes[q.id]||0)>=3; }).length;
    return Math.round(mastered/inMod.length*100);
  }
  function overallMastery(){
    var mastered = QS.filter(function(q){ return (ST.boxes[q.id]||0)>=3; }).length;
    return Math.round(mastered/QS.length*100);
  }
  function reviewQueue(){
    // questions you've gotten wrong / are shaky on (box 1-2), weakest first
    return QS.filter(function(q){ var b=ST.boxes[q.id]; return b!=null && b<=2; })
             .sort(function(a,b){ return (ST.boxes[a.id]) - (ST.boxes[b.id]); });
  }

  // ---- util ----
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function setProgress(p){ document.getElementById('topbarfill').style.width = Math.max(0,Math.min(100,p))+"%"; }

  var app = document.getElementById('app');

  // ---- session ----
  var session = null; // {queue, idx, right, wrong, mode, modId, exam}

  function startSession(mode, modId){
    var queue;
    if(mode==='module') queue = QS.filter(function(q){return q.module===modId;});
    else if(mode==='mixed') queue = shuffle(QS);
    else if(mode==='review') queue = reviewQueue();
    else if(mode==='exam') queue = shuffle(QS).slice(0, Math.min(50, QS.length));
    if(!queue || !queue.length){ renderHome("noreview"); return; }
    session = {queue:queue, idx:0, right:0, wrong:0, answered:false, mode:mode, modId:modId, exam:(mode==='exam')};
    renderQuestion();
  }

  // ---- screens ----
  function renderHome(flag){
    session=null; setProgress(0);
    var chips =
      '<div class="readout">'+
        '<div class="stat"><div class="v">'+QS.length+'</div><div class="l">Questions</div></div>'+
        '<div class="stat grn"><div class="v">'+overallMastery()+'%</div><div class="l">Mastery</div></div>'+
        '<div class="stat amb"><div class="v">'+(ST.exam!=null?ST.exam+'%':'—')+'</div><div class="l">Exam Best</div></div>'+
        '<div class="stat"><div class="v">'+(ST.stats.right+ST.stats.wrong)+'</div><div class="l">Answered</div></div>'+
      '</div>';
    var modes =
      '<div class="lbl">Train</div>'+
      '<div class="modes">'+
        '<button class="mode" data-mode="mixed"><span class="t">Mixed Quiz</span><span class="d">Random questions across every module.</span></button>'+
        '<button class="mode" data-mode="review"><span class="t">Review Misses</span><span class="d">Resurfaces what you got wrong — spaced repetition.</span></button>'+
        '<button class="mode exam" data-mode="exam" style="grid-column:1/-1"><span class="t">Final Exam — 50 Q, graded</span><span class="d">Sit the test. Get a grade + where a pro scores.</span></button>'+
      '</div>';
    var reviewN = reviewQueue().length;
    var noteHtml = flag==='noreview'
      ? '<div class="empty">Nothing to review yet — answer some questions first, and the ones you miss will collect here.</div>' : '';
    var modCards = '<div class="lbl">Modules — learn in order</div><div class="mods">'+
      MODS.map(function(m,i){
        var pct = masteryPct(m.id);
        return '<button class="modcard" data-mod="'+m.id+'">'+
          '<div class="h"><span class="nm"><span style="color:var(--amber)">'+(i+1)+'.</span> '+esc(m.name)+'</span><span class="pct">'+pct+'%</span></div>'+
          '<div class="bl">'+esc(m.blurb)+'</div>'+
          '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
        '</button>';
      }).join('')+'</div>';
    app.innerHTML =
      '<div class="hero">'+
        '<p class="crumb">OPTIONS · ROBINHOOD · $6K → BEAT THE PRO</p>'+
        '<h1>Options<br>Academy</h1>'+
        '<p class="tagline">Learn options <b>correctly</b> — every answer explains the <b>why</b>. Risk-first, built for your real account. '+(reviewN?('<b>'+reviewN+'</b> to review.'):'')+'</p>'+
        chips+
      '</div>'+ noteHtml + modes + modCards +
      '<div class="foot">OPTIONS TRADING ACADEMY · self-contained · progress saved on this device<br>Educational only — not financial advice. Size every trade to a loss you can survive.</div>';
    [].forEach.call(app.querySelectorAll('.mode'), function(b){ b.onclick=function(){ startSession(b.getAttribute('data-mode')); }; });
    [].forEach.call(app.querySelectorAll('.modcard'), function(b){ b.onclick=function(){ startSession('module', b.getAttribute('data-mod')); }; });
  }

  function renderQuestion(){
    var s=session, q=s.queue[s.idx];
    s.answered=false;
    setProgress(s.idx / s.queue.length * 100);
    var m = MODBY[q.module]||{name:q.module};
    var lvName = {1:"Beginner",2:"Intermediate",3:"Advanced"}[q.level]||("L"+q.level);
    var head =
      '<div class="qmeta">'+
        '<span class="chip">'+esc(m.name)+'</span>'+
        '<span class="chip lv l'+q.level+'">'+lvName+'</span>'+
        '<span class="qcount">'+(s.exam?'EXAM ':'')+(s.idx+1)+' / '+s.queue.length+'</span>'+
      '</div>';
    var opts = '<div class="opts">'+ q.options.map(function(o,i){
      return '<button class="opt" data-i="'+i+'"><span class="k">'+LETTERS[i]+'</span><span class="tx">'+esc(o)+'</span><span class="mk"></span></button>';
    }).join('') +'</div>';
    var card = el('<div class="qcard">'+head+'<p class="qtext">'+esc(q.question)+'</p>'+opts+'<div class="after"></div></div>');
    app.innerHTML=''; app.appendChild(card);
    [].forEach.call(card.querySelectorAll('.opt'), function(b){
      b.onclick=function(){ answer(parseInt(b.getAttribute('data-i'),10)); };
    });
  }

  function answer(i){
    var s=session; if(s.answered) return; s.answered=true;
    var q=s.queue[s.idx], correct=(i===q.correct_index);
    recordAnswer(q.id, correct);
    if(correct) s.right++; else s.wrong++;
    var btns = app.querySelectorAll('.opt');
    [].forEach.call(btns, function(b){
      var bi=parseInt(b.getAttribute('data-i'),10);
      b.classList.add('locked');
      if(bi===q.correct_index){ b.classList.add('correct'); b.querySelector('.mk').textContent='✓'; }
      else if(bi===i){ b.classList.add('wrong'); b.querySelector('.mk').textContent='✗'; }
      else b.classList.add('dim');
    });
    // in the exam we still teach (show why), but keep it tight
    var after = app.querySelector('.after');
    var why = '<div class="why"><div class="ct">'+(correct?'✓ WHY YOU\'RE RIGHT':'✗ WHY THE ANSWER IS '+LETTERS[q.correct_index])+'</div><p>'+esc(q.why)+'</p></div>';
    var rh = q.rh_note ? '<div class="rhnote"><div class="ct">YOUR $6K / ROBINHOOD</div><p>'+esc(q.rh_note)+'</p></div>' : '';
    var last = (s.idx>=s.queue.length-1);
    var controls = '<div class="controls">'+
      '<button class="btn ghost" id="quit">Home</button>'+
      '<button class="btn" id="next">'+(last?'See Results':'Next →')+'</button>'+
    '</div>';
    after.innerHTML = why + rh + controls;
    document.getElementById('next').onclick = next;
    document.getElementById('quit').onclick = function(){ renderHome(); };
    after.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  function next(){
    var s=session;
    if(s.idx>=s.queue.length-1){ renderResults(); return; }
    s.idx++; renderQuestion();
  }

  function gradeLetter(pct){
    if(pct>=90) return ['A','a']; if(pct>=80) return ['B','b']; if(pct>=70) return ['C','c'];
    if(pct>=60) return ['D','d']; return ['F','f'];
  }

  function renderResults(){
    var s=session; setProgress(100);
    var total=s.right+s.wrong, pct = total? Math.round(s.right/total*100):0;
    var g = gradeLetter(pct);
    if(s.exam){ ST.exam = Math.max(ST.exam||0, pct); saveState(ST); }
    var bench = s.exam
      ? '<div class="bench"><div class="ct">PRO BENCHMARK</div><p>'+esc(META.pro_benchmark)+'</p></div>' : '';
    var title = s.exam ? 'FINAL EXAM' : (s.mode==='review'?'REVIEW DONE':(s.mode==='module'?(MODBY[s.modId]||{}).name+' DONE':'QUIZ DONE'));
    var msg;
    if(pct>=90) msg='Pro-level. This is the money zone.';
    else if(pct>=75) msg='Strong. Drill the misses and you\'re dangerous.';
    else if(pct>=50) msg='Getting there — Review Misses will close the gap fast.';
    else msg='Early days. Run the modules in order; the why-notes do the teaching.';
    app.innerHTML =
      '<div class="results">'+
        '<p class="crumb mono" style="color:var(--cyan)">'+esc(title)+'</p>'+
        '<div class="grade '+g[1]+'">'+g[0]+'</div>'+
        '<p class="sc">You scored <b>'+s.right+' / '+total+'</b> &nbsp;·&nbsp; <b>'+pct+'%</b></p>'+
        '<p class="tagline" style="margin-top:8px">'+esc(msg)+'</p>'+
        bench+
        '<div class="controls" style="margin-top:18px">'+
          '<button class="btn ghost" id="home">Home</button>'+
          (reviewQueue().length?'<button class="btn amb" id="rev">Review '+reviewQueue().length+' misses</button>':'')+
          '<button class="btn" id="again">'+(s.exam?'Retake Exam':'Go Again')+'</button>'+
        '</div>'+
      '</div>';
    document.getElementById('home').onclick=function(){ renderHome(); };
    document.getElementById('again').onclick=function(){ startSession(s.mode, s.modId); };
    var rv=document.getElementById('rev'); if(rv) rv.onclick=function(){ startSession('review'); };
  }

  // keyboard: 1-4 answer, Enter/Space = next
  document.addEventListener('keydown', function(e){
    if(!session) return;
    if(!session.answered && /^[1-4]$/.test(e.key)){
      var i=parseInt(e.key,10)-1; var b=app.querySelector('.opt[data-i="'+i+'"]'); if(b){ e.preventDefault(); b.click(); }
    } else if(session.answered && (e.key==='Enter'||e.key===' ')){
      var nx=document.getElementById('next'); if(nx){ e.preventDefault(); nx.click(); }
    }
  });

  renderHome();
})();
</script>
</body>
</html>
