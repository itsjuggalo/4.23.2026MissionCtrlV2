# Kronos fine-tune config — US stocks, 1h bars
# Data: pulled by ~/05_AUTOMATION/scripts/kronos_finetune_prep.py
# Train: cd ~/04_RESEARCH/Kronos/finetune_csv && ~/02_DATA/mc-kb/.venv/bin/python train_sequential.py --config configs/config_us_stocks_1h.yaml

data:
  data_path: "/home/itsju/04_RESEARCH/Kronos/finetune_csv/data/us_stocks_1h_all.csv"
  lookback_window: 512
  predict_window: 24
  max_context: 512
  clip: 5.0
  train_ratio: 0.88
  val_ratio: 0.12
  test_ratio: 0.0

training:
  tokenizer_epochs: 10
  basemodel_epochs: 8
  batch_size: 64
  log_interval: 100
  num_workers: 1
  seed: 42

  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000001

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1

  accumulation_steps: 1

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-small"

  exp_name: "us_stocks_1h"
  base_path: "/home/itsju/04_RESEARCH/Kronos/finetune_csv/finetuned/"

  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_us_stocks_1h"
  description: "Fine-tune Kronos-small on US stock + BTC 1h bars (NVDA, TSLA, SPY, QQQ, AAPL, MSFT, AMD, SMCI, META, MU, AMZN, GOOGL, COIN, BTCUSD)"
  use_comet: false
