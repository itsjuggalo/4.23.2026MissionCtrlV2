# Kronos daily maintenance fine-tune — US stocks, 1h bars
# Warm-starts from yesterday's finetuned weights (not pretrained).
# Lower LR + fewer epochs = gentle nudge with fresh data, no catastrophic forgetting.
# Runtime: ~2h. Fired by kronos-train-daily.timer at 06:00 ET Mon-Fri.

data:
  data_path: "/home/itsju/04_RESEARCH/Kronos/finetune_csv/data/us_stocks_1h_all.csv"
  lookback_window: 512
  predict_window: 24
  max_context: 512
  clip: 5.0
  train_ratio: 0.88
  val_ratio: 0.12
  test_ratio: 0.0

training:
  tokenizer_epochs: 3
  basemodel_epochs: 2
  batch_size: 64
  log_interval: 100
  num_workers: 1
  seed: 42

  tokenizer_learning_rate: 0.00002
  predictor_learning_rate: 0.0000001

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1

  accumulation_steps: 1

model_paths:
  # Warm-start from finetuned weights, not HuggingFace pretrained
  pretrained_tokenizer: "/home/itsju/04_RESEARCH/Kronos/finetune_csv/finetuned/us_stocks_1h/tokenizer/best_model"
  pretrained_predictor: "/home/itsju/04_RESEARCH/Kronos/finetune_csv/finetuned/us_stocks_1h/basemodel/best_model"

  exp_name: "us_stocks_1h"
  base_path: "/home/itsju/04_RESEARCH/Kronos/finetune_csv/finetuned/"

  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_us_stocks_1h_daily"
  description: "Daily maintenance fine-tune on US stock + BTC 1h bars (NVDA, TSLA, SPY, QQQ, AAPL, MSFT, AMD, SMCI, META, MU, AMZN, GOOGL, COIN, BTCUSD)"
  use_comet: false
