# logrotate config for the Kronos daily-retrain log.
# Run by kronos-logrotate.timer (user systemd) at 01:30 ET — BEFORE the 02:00 ET retrain,
# so each overnight run appends to a fresh log. copytruncate keeps any open fd valid.
/home/itsju/05_AUTOMATION/scripts/logs/kronos_train_daily.log {
    daily
    rotate 14
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    dateext
}
